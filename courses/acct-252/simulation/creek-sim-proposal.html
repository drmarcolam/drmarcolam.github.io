<script>
"use strict";
/* ===================== CONFIGURATION (instructor: keep in sync with the Excel Setup sheet) ===================== */
const CFG={
  teams:12, potPerTeam:800000, maxRound:8,
  reachSpend:3200000, w0:0.28, p0:80, slope:0.012, wmin:0.02, calls:500, carry:0.8,
  pmin:40, pmax:89, admax:4000000, repmax:300, salmax:20000, prodmax:180000, wagemin:6, wagemax:50, msizemax:200000, nordmax:40, eqmax:300,
  baseUnits:72157, baseAd:300000, baseSeason:1.2,
  hours:8, days:66, matPer:2, genoh:200000, matfix:44353, fgcarry:2, admin:240000, bdep:22500, intr:45500, tax:0.4,
  upm:500, effexp:0.35, effcap:1.25, otcap:0.2, otprem:1.5, life:40, rawcarry:2,
  tiers:[[0,1.10],[10000,1.05],[20000,1.00],[40000,0.95],[80000,0.90]],
  base:{sal:7000,hire:2000,leave:1500,mat:10,wage:8,order:100,train:1000,relw:1000,eqp:50000},
  growth:{ad:0.08,sal:0.04,hire:0.03,mat:0.04,wage:0.02,lab:0.03,eq:0.03},
  seasons:[1,0.95,0.85,1.2], tbase:0.05, tsens:0.5, tmin:0.02, tmax:0.5,
  colfrac:1/3, loancap:0.4, loanrate:0.10, bondrate:0.05, odrate:0.18, aprate:0.15, apfree:1000000, par:100,
  u:{prod:2,crew:3,msize:3,nord:3,wage:4,equip:4,ot:4,loan:5,ap:5,fin:99},
  start:{reps:128,fgu:12381,fgd:651608,price:80,ad:300000,sal:7000,crew:332,E:166,edep:207500,rawu:22000,cash:500000,ar:3848365,ap:0,loan:0,repay:0,eq:8802094,assets:14227549,msize:30000,nord:4},
  fixedProdR1:60000
};
const REQUIRED_WORDS=20;
const ROUNDS=Array.from({length:CFG.maxRound},(_,i)=>i+1);
/* decisions in the same order as the Excel entry columns */
const DEC=[
 {k:'price',n:1,label:'Price per peeler ($)',u:'one',step:'0.01'},
 {k:'ad',n:2,label:'Advertising ($)',u:'one'},
 {k:'reps',n:3,label:'Number of sales people',u:'one',step:'1'},
 {k:'sal',n:4,label:'Salary per sales person per quarter ($)',u:'one'},
 {k:'prod',n:10,label:'Planned production (units)',u:'prod',step:'1'},
 {k:'crew',n:5,label:'Number of factory workers',u:'crew',step:'1'},
 {k:'wage',n:6,label:'Wage per hour ($)',u:'wage',step:'0.01'},
 {k:'msize',n:7,label:'Material X order size (units)',u:'msize',step:'1'},
 {k:'nord',n:8,label:'Number of orders',u:'nord',step:'1'},
 {k:'equip',n:9,label:'Additional equipment (machines)',u:'equip',step:'1'},
 {k:'ot',n:11,label:'Overtime',u:'ot',sel:true},
 {k:'loan',n:12,label:'Bank loan ($)',u:'loan'},
 {k:'ap',n:16,label:'Accounts payable payment ($)',u:'ap'},
 {k:'bonds',n:13,label:'Bonds issued ($ face)',u:'fin'},
 {k:'stock',n:14,label:'Common stock issued (shares)',u:'fin'},
 {k:'div',n:15,label:'Dividend per share ($)',u:'fin',step:'0.01'}];
const unlockRound=f=>f.u==='one'?1:CFG.u[f.u];
const isOn=(f,k)=>k>=unlockRound(f);
const RMETA={
 1:{ch:'Chapter 2 (cost-volume-profit)',due:'Friday, January 29',why:[['pa','Price and advertising','Explain how your CVP analysis and sales forecast support your price and advertising.'],['sf','Sales force and salary','How did you choose the number of sales people and the pay level? Use sales force capacity and turnover.'],['rv','Rivals','Which rival move worries you most, and how does your plan hold up if rivals cut price or advertise more?']]},
 2:{ch:'Chapters 3 and 4 (overhead rates; absorption and variable costing)',due:'Friday, February 12',why:[['learn','What you learned from Round 1','What did your Round 1 results and the rivals\' decisions show? What did you change and why?'],['prod','Production','Show how your production budget connects to your forecast, finished goods and capacity. Mention fixed cost per unit and what happens if you overproduce.'],['cost','Rising costs','Name at least two costs that rose this round. How did you adjust your decisions?']]},
 3:{ch:'Chapter 5 (activity-based costing)',due:'Monday, February 22',why:[['learn','What you learned from Round 2','Compare your forecast with what happened. What did you change?'],['mat','Ordering decision','Use the ordering analysis: what order size and number of orders did you choose, and what does each order cost you once carrying cost and the quantity discount are counted?'],['labor','Factory workers','How many workers did you choose and why? Include the cost of training and releasing workers and the machines they run.']]},
 4:{ch:'Chapter 6 (relevant costs and constrained resources)',due:'Friday, March 5',why:[['learn','What you learned from Round 3','What did your results show about materials, workers and capacity?'],['cap','Capacity decisions','Use the capacity analysis: did capacity limit your sales? Which of overtime, a higher wage or new machines did you choose, and which costs are relevant to that choice?'],['incr','Incremental analysis','Show the incremental revenue and incremental cost of your largest change this round. Say what costs you ignored because they do not differ between the options.']]},
 5:{ch:'Chapter 8 (master budget and cash budget)',due:'Friday, March 19',why:[['learn','What you learned from Round 4','What did your results show about capacity, the wage and overtime?'],['cash','Cash budget','Use the projected cash table: what is your lowest cash balance, and how do your loan and payables decisions keep you out of an overdraft?'],['fin','Financing choice','Compare the cost of a bank loan (10%), unpaid payables above the $1,000,000 limit (15%) and an overdraft (18%). Which did you use and why?']]},
 6:{ch:'Chapter 9 (flexible budgets and performance reports)',due:'Monday, April 5',why:[['learn','What you learned from Round 5','What did your Round 5 results show? What changed in your plan?'],['flex','Performance report','Use the flexible-budget report: how much of the difference from your budget came from activity, selling price, variable costs and fixed costs?'],['act','Actions','Name two actions you took this round because of the report, with the numbers behind each.']]},
 7:{ch:'Chapter 10 (standard costs and variances)',due:'Wednesday, April 14',why:[['learn','What you learned from Round 6','What did your Round 6 results show? What changed in your plan?'],['var','Variance analysis','Use the variance table: which variance is largest, who in the company controls it, and is it favorable or unfavorable?'],['act','Actions','Name two actions you took this round because of the variances, with the numbers behind each.']]},
 8:{ch:'Chapter 12 (balanced scorecard and operating measures)',due:'Wednesday, April 28',why:[['learn','What you learned from Round 7','What did your Round 7 results show? What changed in your plan?'],['card','Scorecard','Use the scorecard: which of the four perspectives is your strongest and which is your weakest? Support each with a measure.'],['final','Final reflection','Looking at all eight rounds, which two decisions mattered most to your results and what would you do differently?']]}
};
/* ===================== MODEL HELPERS ===================== */
function env(k){const g=CFG.growth,b=CFG.base,p=k-1;return{
  season:CFG.seasons[(k-1)%4], adIdx:Math.pow(1+g.ad,p), reachSpend:CFG.reachSpend*Math.pow(1+g.ad,p),
  sal:b.sal*Math.pow(1+g.sal,p), hire:b.hire*Math.pow(1+g.hire,p), leave:b.leave*Math.pow(1+g.hire,p),
  mat:b.mat*Math.pow(1+g.mat,p), wage:b.wage*Math.pow(1+g.wage,p), order:b.order*Math.pow(1+g.lab,p),
  train:b.train*Math.pow(1+g.lab,p), relw:b.relw*Math.pow(1+g.lab,p), eqp:b.eqp*Math.pow(1+g.eq,p)};}
const Ppot=()=>CFG.potPerTeam*CFG.teams;
function reach(ad,k){return Math.sqrt(Math.min(1,Math.max(0,ad)/env(k).reachSpend));}
function willing(p){return Math.max(CFG.wmin,CFG.w0-CFG.slope*(p-CFG.p0));}
function kcal(){const N=CFG.teams,r=Math.sqrt(CFG.baseAd/CFG.reachSpend),U=1-Math.pow(1-r,N);return CFG.baseUnits*N/(CFG.baseSeason*Ppot()*U*CFG.w0);}
function tierMult(size){let m=CFG.tiers[0][1];CFG.tiers.forEach(t=>{if(size>=t[0])m=t[1];});return m;}
function turn(sal,k){const m=env(k).sal;return Math.min(CFG.tmax,Math.max(CFG.tmin,CFG.tbase+CFG.tsens*Math.max(0,(m-sal)/m)));}
function wageEff(wage,k){return wage>0?Math.min(CFG.effcap,Math.pow(wage/env(k).wage,CFG.effexp)):0;}
function estimateDemand(k,price,ad,rPrice,rAd){
  const N=CFG.teams,P=Ppot(),r=reach(ad,k),rr=reach(rAd,k),w=willing(price),rw=willing(rPrice);
  const Wme=P*r*w,Wr=P*rr*rw,Wtot=Wme+(N-1)*Wr,union=1-(1-r)*Math.pow(1-rr,N-1),sumReach=r+(N-1)*rr;
  const wbar=sumReach>0?Wtot/(P*sumReach):0,D=kcal()*env(k).season*P*union*wbar,share=Wtot>0?Wme/Wtot:0;
  return{reach:r,willing:w,share:share,industry:Math.round(D),own:Math.round(share*D)};}
/* ===================== FORMATTING ===================== */
const fmt={n:v=>isFinite(v)?Math.round(v).toLocaleString('en-US'):'–',
  d:v=>isFinite(v)?(v<0?'(':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US')+(v<0?')':''):'–',
  d2:v=>isFinite(v)?'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'–',
  p:v=>isFinite(v)?(v*100).toFixed(1)+'%':'–',x:v=>isFinite(v)?v.toFixed(3):'–'};
const num=v=>{if(v===''||v===null||v===undefined)return NaN;const x=Number(String(v).replace(/[$,\s]/g,''));return isFinite(x)?x:NaN;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
/* ===================== STATE ===================== */
let state={team:{num:'',name:'',members:''},rounds:{},current:1};
try{const raw=document.getElementById('saved-state').textContent.trim();if(raw&&raw!=='{}'){const s=JSON.parse(raw);state=Object.assign(state,s);state.rounds=Object.assign({},s.rounds||{});}}catch(e){}
ROUNDS.forEach(k=>{if(!state.rounds[k])state.rounds[k]={};});
if(!ROUNDS.includes(state.current))state.current=1;
function getPath(p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],state);}
function setPath(p,v){const ks=p.split('.');let o=state;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;}
const val=(p,d='')=>{const v=getPath(p);return v==null?d:v;};
const R=k=>`rounds.${k}`;
const idOf=p=>p.replace(/\./g,'-');
/* ===================== TEMPLATES ===================== */
function inp(path,label,o={}){
  const id=idOf(path),hint=o.hint?`<span id="${id}-h" class="note">${o.hint}</span>`:'';
  const v=val(path,o.def!==undefined?o.def:''),type=o.text?'text':'number';
  return `<div><label for="${id}">${label}</label>${hint?hint+'<br>':''}<input id="${id}" data-path="${path}" type="${type}" ${o.step?`step="${o.step}"`:''} ${o.min!==undefined?`min="${o.min}"`:''} ${o.max!==undefined?`max="${o.max}"`:''} inputmode="${o.text?'text':'decimal'}" value="${esc(v)}" aria-describedby="${hint?id+'-h ':''}${id}-e" autocomplete="off"><span id="${id}-e" class="note" role="status"></span></div>`;}
function sel(path,label,opts,o={}){
  const id=idOf(path),hint=o.hint?`<span id="${id}-h" class="note">${o.hint}</span>`:'',v=String(val(path,o.def!==undefined?o.def:''));
  return `<div><label for="${id}">${label}</label>${hint?hint+'<br>':''}<select id="${id}" data-path="${path}" aria-describedby="${hint?id+'-h ':''}${id}-e">${opts.map(x=>`<option value="${x[0]}"${String(x[0])===v?' selected':''}>${x[1]}</option>`).join('')}</select><span id="${id}-e" class="note" role="status"></span></div>`;}
function area(path,label,hint){const id=idOf(path);
  return `<div><label for="${id}">${label}</label><span id="${id}-h" class="note">${hint||''}</span><textarea id="${id}" data-path="${path}" aria-describedby="${id}-h ${id}-w">${esc(val(path))}</textarea><span id="${id}-w" class="note" role="status"></span></div>`;}
const out=(id,cls='')=>`<span id="${id}" class="${cls}"></span>`;
const trow=(label,id,cls='num')=>`<tr><th scope="row">${label}</th><td class="${cls}">${out(id)}</td></tr>`;
const table=(cap,rows)=>`<table><caption>${cap}</caption><tbody>${rows.join('')}</tbody></table>`;
/* ===================== DECISIONS, STARTING POSITION, PROJECTION ===================== */
function defaultDec(k,f){const E=env(k),b=beg(k);
  switch(f.k){case 'prod':return k===1?CFG.fixedProdR1:NaN;case 'crew':return b.crew;case 'wage':return E.wage;
    case 'msize':return CFG.start.msize;case 'nord':return CFG.start.nord;case 'equip':case 'ot':case 'loan':case 'bonds':case 'stock':case 'div':return 0;
    case 'ap':return NaN;default:return NaN;}}
function decisions(k){const d={},raw=getPath(R(k)+'.dec')||{};
  DEC.forEach(f=>{d[f.k]=isOn(f,k)?num(raw[f.k]):defaultDec(k,f);});
  if(k===1)d.prod=CFG.fixedProdR1;return d;}
const BASEF=['sold','waiting','fgu','fgd','reps','share','niv','rank','industry','rprice','rad'];
const EXTF=['crew','E','edep','rawu','rawd','cash','ar','ap','loan','repay','eq','assets'];
function beg(k){const s=CFG.start,g=x=>num(val(R(k)+'.res.'+x));
  if(k===1)return{reps:s.reps,fgu:s.fgu,fgd:s.fgd,waiting:0,crew:s.crew,E:s.E,edep:s.edep,rawu:s.rawu,rawd:s.rawu*CFG.base.mat,cash:s.cash,ar:s.ar,ap:0,loan:0,repay:0,eq:s.eq,assets:s.assets};
  const o={reps:g('reps'),fgu:g('fgu'),fgd:g('fgd'),waiting:g('waiting')||0};
  EXTF.forEach(x=>{o[x]=k>=3?g(x):(x==='rawd'?s.rawu*env(2).mat:s[x]);});
  return o;}
function project(k,d,b,units,waiting){
  const E=env(k),r={},u=CFG.u,legacy=k<u.msize;
  const newo=Math.min(units,d.reps*CFG.calls),orders=newo+waiting;
  const eff=wageEff(d.wage,k),capno=Math.min(b.E,d.crew/2)*CFG.upm*eff,captot=capno*(1+CFG.otcap*d.ot);
  const purchu=legacy?0:d.msize*d.nord,availu=b.rawu+purchu,rawlim=legacy?Infinity:Math.floor(availu/CFG.matPer);
  const pact=Math.max(0,Math.min(d.prod,Math.floor(captot),rawlim));
  const f=(d.ot===1&&capno>0)?Math.min(CFG.otcap,Math.max(0,pact/capno-1)):0;
  const labor=d.crew*CFG.hours*CFG.days*d.wage,otp=labor*f*CFG.otprem;
  const avail=b.fgu+pact,sold=Math.min(orders,avail),ei=avail-sold;
  let mat,purch,ordc=0,rc=0,invc,rawe;
  if(legacy){mat=pact*CFG.matPer*E.mat;purch=mat;invc=CFG.matfix+CFG.fgcarry*ei;rawe=b.rawu;}
  else{const pu=E.mat*tierMult(d.msize);purch=purchu*pu;const availd=b.rawd+purch,used=pact*CFG.matPer;
    mat=availu>0?used*availd/availu:0;rawe=availu-used;ordc=d.nord*E.order;rc=CFG.rawcarry*(b.rawu+rawe)/2;invc=ordc+rc+CFG.fgcarry*ei;}
  const ohfix=b.edep+CFG.genoh,cogm=mat+labor+otp+ohfix+invc,avg=avail>0?(b.fgd+cogm)/avail:0,cogs=sold*avg;
  const hires=Math.max(0,d.reps-b.reps),rels=Math.max(0,b.reps-d.reps),quits=Math.round(d.reps*turn(d.sal,k));
  const crewc=Math.max(0,d.crew-b.crew)*E.train+Math.max(0,b.crew-d.crew)*E.relw;
  const opex=d.ad+d.reps*d.sal+CFG.admin+(hires+quits)*E.hire+(rels+quits)*E.leave+crewc+CFG.bdep;
  const sales=sold*d.price,noi=sales-cogs-opex;
  const fin=k>=u.fin;
  const Leff=k>=u.loan?Math.min(isNaN(d.loan)?0:d.loan,Math.max(0,CFG.loancap*b.eq-b.loan)):0,repay=b.repay||0;
  const bonds=fin?(d.bonds||0):0,stockAmt=fin?(d.stock||0)*CFG.par:0,divAmt=fin?(d.div||0)*86500:0;
  const apdue=b.ap+purch,appaid=isNaN(d.ap)||k<u.ap?apdue:Math.max(0,Math.min(d.ap,apdue)),apE=apdue-appaid;
  const pen=CFG.aprate/4*Math.max(0,apE-CFG.apfree),od=CFG.odrate/4*Math.max(0,-b.cash),loanInt=CFG.loanrate/4*b.loan;
  const intr=CFG.intr+loanInt+pen+od,pre=noi-intr,tax=pre*CFG.tax,ni=pre-tax;
  const eqcost=(k>=u.equip?(d.equip||0):0)*E.eqp,coll=sales*CFG.colfrac+b.ar;
  const cashout=appaid+labor+otp+CFG.genoh+invc+(opex-CFG.bdep)+intr+tax+eqcost+repay+divAmt;
  const cashE=b.cash+coll+Leff+bonds+stockAmt-cashout;
  Object.assign(r,{eff,capno,captot,pact,f,labor,otp,mat,purch,ordc,rc,invc,cogm,avg,cogs,opex,sales,noi,sold,ei,orders,intr,ni,tax,coll,Leff,repay,appaid,apE,pen,od,loanInt,eqcost,cashout,cashE,rawe,crewc,ohfix,rawlim,quits,
    vcu:(pact>0?(mat+otp)/pact:E.mat*CFG.matPer*tierMult(d.msize||CFG.start.msize)),fixedAll:labor+ohfix+invc+opex,loanRoom:Math.max(0,CFG.loancap*b.eq-b.loan)});

function forecast(k){

function decisionForm(k){

   msize:`Larger orders get a lower price per unit (see the table in Step 3). Up to ${fmt.n(CFG.msizemax)} units.`,
   nord:`Whole number up to ${CFG.nordmax}. Each order costs ${fmt.d(E.order)}. Order size × orders = units bought.`,
   equip:`Whole number. Each machine costs ${fmt.d(E.eqp)}, arrives next round and adds ${fmt.n(CFG.upm)} units of capacity (needs 2 workers). The company can have ${CFG.eqmax} machines at most.`,
   loan:`Up to 40% of your beginning equity less the balance you owe. Interest ${Math.round(CFG.loanrate*100)}% a year; repaid in four equal installments starting next round.`,
   ap:`Leave blank to pay everything you owe. Payables above ${fmt.d(CFG.apfree)} cost ${Math.round(CFG.aprate*100)}% a year.`,
   bonds:'',stock:'',div:''}[f.k]);
  const field=f=>{const o={step:f.step,hint:`${hint(f)}`,def:undefined};
    const prevv=k>1?val(R(k-1)+'.dec.'+f.k):'';

  return h;}

function validate(k){
  const d=decisions(k),E=env(k),b=beg(k),msgs=[],bad=new Set(),add=(t,s,m)=>msgs.push({t,s,m}),on=f=>isOn(DEC.find(x=>x.k===f),k);
  const rng=(key,lo,hi,label,int)=>{if(!on(key))return;const v=d[key];if(isNaN(v)){if(key!=='ap')add('err',label,'Enter a value.');return;}if(v<lo||v>hi||(int&&v!==Math.floor(v))){add('err',label,`${label}: use ${int?'a whole number ':'a value '}from ${fmt.n(lo)} to ${fmt.n(hi)}.`);bad.add(key);}};
  rng('price',CFG.pmin,CFG.pmax,'Price');rng('ad',0,CFG.admax,'Advertising');rng('reps',0,CFG.repmax,'Sales people',true);rng('sal',0,CFG.salmax,'Salary');
  rng('prod',0,CFG.prodmax,'Production',true);rng('crew',0,2*CFG.eqmax,'Workers',true);rng('wage',CFG.wagemin,CFG.wagemax,'Wage');rng('msize',0,CFG.msizemax,'Order size',true);rng('nord',0,CFG.nordmax,'Orders',true);
  rng('equip',0,CFG.eqmax-(b.E||CFG.start.E),'Equipment',true);rng('loan',0,1e9,'Loan');
  if(k===1)d.prod=CFG.fixedProdR1;
  if(!isNaN(d.ad)&&d.ad>E.reachSpend)add('warn','Advertising',`Spending above ${fmt.d(E.reachSpend)} adds no reach.`);
  if(!isNaN(d.sal)&&d.sal<E.sal)add('warn','Salary',`Below the market salary of ${fmt.d(E.sal)}: expect more people to quit (about ${fmt.p(turn(d.sal,k))}).`);
  const fc=forecast(k);
  if(!isNaN(d.reps)&&fc.adj>0&&fc.adj>d.reps*CFG.calls)add('warn','Sales force',`Your forecast of ${fmt.n(fc.adj)} units is above what ${fmt.n(d.reps)} sales people can handle (${fmt.n(d.reps*CFG.calls)}). Demand above that is lost.`);
  const dd=Object.assign({},d);DEC.forEach(f=>{if(isNaN(dd[f.k])&&f.k!=='ap')dd[f.k]=defaultDec(k,f)||0;});
  if([dd.prod,dd.crew,dd.wage].every(x=>isFinite(x))&&b.E){const eff=wageEff(dd.wage,k),cap=Math.min(b.E,dd.crew/2)*CFG.upm*eff*(1+CFG.otcap*(dd.ot||0));

    if(k>=CFG.u.msize&&isFinite(b.rawu)){const lim=Math.floor((b.rawu+(dd.msize||0)*(dd.nord||0))/CFG.matPer);if(dd.prod>lim)add('warn','Materials',`The material you will have allows only ${fmt.n(lim)} peelers. Buy more or plan less.`);}}
  if(fc.adj>0&&!isNaN(d.prod)&&d.prod+(b.fgu||0)>fc.adj+5000+ (b.fgu||0)&&k>1)add('warn','Supply','You plan to make far more than you expect to sell. Extra units add carrying cost.');
  if(k>=CFG.u.loan&&!isNaN(d.loan)&&b.eq){const room=Math.max(0,CFG.loancap*b.eq-b.loan);if(d.loan>room)add('warn','Loan',`The bank will lend at most ${fmt.d(room)}. Any more is refused.`);}
  return{msgs,bad,d};}

    const pr=project(k,dd,b,fc.units||0,fc.waiting||0),okp=[dd.price,dd.ad,dd.reps,dd.sal,dd.prod,dd.crew,dd.wage,b.reps,b.fgu,b.fgd,b.E].every(isFinite);

        setText(q+'-c0',fmt.d(b.cash));setText(q+'-coll',fmt.d(pr.coll));setText(q+'-loan',fmt.d(pr.Leff));setText(q+'-ap',fmt.d(-pr.appaid));setText(q+'-lab',fmt.d(-(pr.labor+pr.otp)));setText(q+'-oh',fmt.d(-(CFG.genoh+pr.invc+pr.opex-CFG.bdep)));setText(q+'-it',fmt.d(-(pr.intr+pr.tax)));setText(q+'-eq',fmt.d(-pr.eqcost));setText(q+'-rep',fmt.d(-pr.repay));setText(q+'-c1',fmt.d(pr.cashE));setText(q+'-ape',fmt.d(pr.apE));setText(q+'-room',fmt.d(pr.loanRoom));
        const fl=document.getElementById(q+'-flags');
        if(fl)fl.innerHTML=(pr.cashE<0?`<p class="msg err"><strong>Overdraft:</strong> projected cash is ${fmt.d(pr.cashE)}. Negative cash costs ${Math.round(CFG.odrate*100)}% a year next round. Consider a loan or paying fewer payables.</p>`:'<p class="msg ok"><strong>OK:</strong> projected cash stays positive.</p>')+(pr.apE>CFG.apfree?`<p class="msg warn"><strong>Check:</strong> payables above ${fmt.d(CFG.apfree)} cost ${Math.round(CFG.aprate*100)}% a year (about ${fmt.d(pr.pen)} this round).</p>`:'');}
      else{['pact','sold','sales','cogs','opex','intr','ni','c0','coll','loan','ap','lab','oh','it','eq','rep','c1','ape','room'].forEach(x=>setText(q+'-'+x,'Enter your starting position and decisions'));}}
    if(okp&&fc.adj>0&&pr.sold>0)state.rounds[k]._proj={sold:pr.sold,price:dd.price,vcu:pr.vcu,fixed:pr.fixedAll};
    if(k===6||k===7||k===8){}
    /* tool calculators */
    if(k===6){const t=getPath(p+'.tool')||{},q='t6-f',bq=num(t.bq),bp=num(t.bp),bv=num(t.bv),bf=num(t.bf),aq=num(t.aq),as=num(t.as),av=num(t.av),af=num(t.af);
      const bs=bq*bp,bvv=bq*bv,fs=aq*bp,fv=aq*bv,F=x=>isFinite(x)?fmt.d(x):'–',FU=x=>isFinite(x)?fmt.d(Math.abs(x))+(x>=0?' F':' U'):'–';
      setText(q+'-aq',fmt.n(aq));setText(q+'-aq2',fmt.n(aq));setText(q+'-bq',fmt.n(bq));setText(q+'-as',F(as));setText(q+'-fs',F(fs));setText(q+'-bs',F(bs));setText(q+'-av',F(av));setText(q+'-fv',F(fv));setText(q+'-bv',F(bvv));
      setText(q+'-acm',F(as-av));setText(q+'-fcm',F(fs-fv));setText(q+'-bcm',F(bs-bvv));setText(q+'-af',F(af));setText(q+'-ff',F(bf));setText(q+'-bf',F(bf));setText(q+'-ani',F(as-av-af));setText(q+'-fni',F(fs-fv-bf));setText(q+'-bni',F(bs-bvv-bf));
      setText(q+'-v-act',FU((fs-fv)-(bs-bvv)));setText(q+'-v-rev',FU(as-fs));setText(q+'-v-var',FU(fv-av));setText(q+'-v-fix',FU(bf-af));setText(q+'-v-tot',FU((as-av-af)-(bs-bvv-bf)));}
    if(k===7){const t=getPath(p+'.tool')||{},q='t7-v',sp=num(t.sp),sq=num(t.sq),sr=num(t.sr),sh=num(t.sh),au=num(t.au),am=num(t.am),ah=num(t.ah),ar=num(t.ar);
      const uses=au*CFG.matPer,apu=am/uses,mpv=(apu-sp)*uses,mqv=(uses-au*sq)*sp,hrs=au*sh,lrv=(ar-sr)*ah,lev=(ah-hrs)*sr,FU=x=>isFinite(x)?fmt.d(Math.abs(x))+(x<=0?' F':' U'):'–';
      setText(q+'-aq',fmt.n(uses)+' units at '+(isFinite(apu)?fmt.d2(apu):'–'));setText(q+'-mpv',FU(mpv));setText(q+'-mqv',FU(mqv));setText(q+'-sh',fmt.n(hrs));setText(q+'-lrv',FU(lrv));setText(q+'-lev',FU(lev));setText(q+'-lt',FU(lrv+lev));}
    if(k===8){const t=getPath(p+'.tool')||{},q='t8-s',made=num(t.made),capn=num(t.capno);
      setText(q+'-roa',isFinite(num(t.roa))?num(t.roa).toFixed(1)+'%':'–');setText(q+'-ni',fmt.d(num(t.ni)));setText(q+'-ms',isFinite(num(t.ms))?num(t.ms).toFixed(1)+'%':'–');setText(q+'-fill',fmt.p(num(t.sold)/num(t.orders)));
      setText(q+'-oee',fmt.p(made/capn));setText(q+'-quit',fmt.p(num(t.quits)/num(t.reps)));setText(q+'-rk',isFinite(num(t.rk))?'#'+num(t.rk)+' of '+CFG.teams:'–');}
    /* checks & summary */
    const v=validate(k),box=document.getElementById(pid+'-checks');
    if(box)box.innerHTML=v.msgs.length?v.msgs.map(m=>`<p class="msg ${m.t}"><strong>${m.t==='err'?'Fix:':'Check:'}</strong> ${esc(m.m)}</p>`).join(''):'<p class="msg ok"><strong>OK:</strong> All decisions are within the limits.</p>';
    DEC.forEach(f=>{const el=document.getElementById(pid+'-dec-'+f.k);if(el)el.setAttribute('aria-invalid',v.bad.has(f.k)?'true':'false');});
    const okDec=!v.msgs.some(m=>m.t==='err'),act=DEC.filter(f=>isOn(f,k)&&f.u!=='fin');
    act.forEach(f=>{const x=d[f.k];setText('sum-'+k+'-'+f.k,f.k==='ap'&&isNaN(x)?'Pay all':isNaN(x)?'–':['price','wage'].includes(f.k)?fmt.d2(x):['ad','sal','loan','ap'].includes(f.k)?fmt.d(x):fmt.n(x));});
    const need=act.filter(f=>f.k!=='ap'&&f.k!=='loan'),allIn=need.every(f=>!isNaN(d[f.k]));
    const resOK=k===1||(k===2?BASEF:BASEF.concat(EXTF)).every(x=>!isNaN(num(val(p+'.res.'+x))));
    const items=[['Team number and team name entered',!!(num(val('team.num'))>=1&&String(val('team.name')).trim())],['All decisions entered within the limits',okDec&&allIn],['Sales forecast completed',fc.adj>0],['Each explanation has at least '+REQUIRED_WORDS+' words',RMETA[k].why.every(x=>words(val(p+'.why.'+x[0]))>=REQUIRED_WORDS)]];
    if(k>1)items.splice(1,0,['Round '+(k-1)+' results entered',resOK]);
    const cb=document.getElementById('check-'+k);
    if(cb)cb.innerHTML='<ul>'+items.map(i=>`<li>${i[1]?'<strong>Done:</strong>':'<strong>Not yet:</strong>'} ${esc(i[0])}</li>`).join('')+'</ul>';
    state.rounds[k]._complete=items.every(i=>i[1]);state.rounds[k]._valid=okDec;
    RMETA[k].why.forEach(x=>{const w=document.getElementById(idOf(p)+'-why-'+x[0]+'-w');if(w)w.textContent=words(val(p+'.why.'+x[0]))+' words';});
  });
  const t=state.team,parts=[`Team ${t.num||'?'} · ${t.name||'(no team name)'}`];
  ROUNDS.forEach(k=>{const d=decisions(k),any=['price','ad','reps','sal'].some(x=>!isNaN(d[x])&&val(R(k)+'.dec.'+x)!=='');if(any)parts.push(`Round ${k}: price ${isNaN(d.price)?'–':fmt.d2(d.price)}, advertising ${isNaN(d.ad)?'–':fmt.d(d.ad)}, sales people ${isNaN(d.reps)?'–':d.reps}${state.rounds[k]._complete?' (ready)':' (not complete)'}`);});
  setText('top-summary-text',parts.join('  |  '));}
/* ===================== ACTIONS ===================== */
function sync(){document.querySelectorAll('[data-path]').forEach(el=>{setPath(el.dataset.path,el.value);});}
function rowText(k){const d=decisions(k);return DEC.map(f=>{if(!isOn(f,k)||(f.u==='fin'))return'';const x=d[f.k];return isNaN(x)?'':String(x);}).join('\t');}
function save(k){
  sync();recalc();state.current=k;state.savedAt=new Date().toISOString();
  const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';
  clone.querySelector('#saved-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  const n=String(num(state.team.num)||0).padStart(2,'0'),name='Team'+n+'_Round'+k+'_Proposal.html';
  const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  setText('action-msg-'+k,'Saved as '+name+'. '+(state.rounds[k]._complete?'Upload this file to Canvas.':'Some items above are not finished. You can still upload, or finish them and save again.'));}
function copyRow(k){
  sync();recalc();
  if(!state.rounds[k]._valid){setText('action-msg-'+k,'Fix the decisions marked above before copying.');return;}
  const txt=rowText(k),done=()=>setText('action-msg-'+k,'Copied the decisions in the order of the Excel columns (tab-separated; blanks are decisions not open yet).');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done);}
function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
function useEstimate(k){
  const p=R(k),rp=num(val(p+'.est.rprice')),ra=num(val(p+'.est.rad')),d=decisions(k);
  if([rp,ra,d.price,d.ad].some(isNaN))return;
  const e=estimateDemand(k,d.price,d.ad,rp,ra);
  setPath(p+'.fc.ind2',String(e.industry));setPath(p+'.fc.sh2',(e.share*100).toFixed(1));
  document.getElementById(idOf(p+'.fc.ind2')).value=String(e.industry);document.getElementById(idOf(p+'.fc.sh2')).value=(e.share*100).toFixed(1);recalc();}
function fillBudget(k){const pr=state.rounds[k-1]&&state.rounds[k-1]._proj,p=R(k)+'.tool';
  if(!pr){setText('t'+k+'-f-fillmsg','No plan found: complete the sales forecast and decisions in Round '+(k-1)+' first.');return;}
  const set=(f,v)=>{setPath(p+'.'+f,String(v));const el=document.getElementById(idOf(p+'.'+f));if(el)el.value=String(v);};
  set('bq',Math.round(pr.sold));set('bp',pr.price);set('bv',pr.vcu.toFixed(2));set('bf',Math.round(pr.fixed));setText('t'+k+'-f-fillmsg','Filled from your Round '+(k-1)+' plan.');recalc();}
function showTab(k){state.current=k;ROUNDS.forEach(r=>{const t=document.getElementById('tab-'+r),pn=document.getElementById('panel-'+r);t.setAttribute('aria-selected',r===k);t.tabIndex=r===k?0:-1;pn.hidden=r!==k;});}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.path){setPath(el.dataset.path,el.value);recalc();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.path){setPath(el.dataset.path,el.value);recalc();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){showTab(Number(b.dataset.tab));return;}
  const a=b.dataset.action,k=Number(b.dataset.round);
  if(a==='save')save(k);else if(a==='copy')copyRow(k);else if(a==='print')window.print();else if(a==='useEstimate')useEstimate(k);else if(a==='fillBudget')fillBudget(k);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&t.getAttribute&&t.getAttribute('role')==='tab'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const k=Number(t.dataset.tab),n=e.key==='ArrowRight'?Math.min(ROUNDS.length,k+1):Math.max(1,k-1);showTab(n);document.getElementById('tab-'+n).focus();}});
render();sync();recalc();
</script>
