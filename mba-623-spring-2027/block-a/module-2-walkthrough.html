*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:1.0625rem}
.skip{position:absolute;left:-999px;top:0;background:var(--spruce);color:var(--spruce-ink);padding:.6rem 1rem;z-index:10}
.skip:focus{left:.5rem;top:.5rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{padding:1.1rem 1.25rem .4rem;max-width:1120px;margin:0 auto}

.mark.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.mark.cur{border-color:var(--spruce);color:var(--spruce)}
main{min-width:0}
.progress{display:flex;align-items:center;gap:.75rem;margin:.2rem 0 1rem;color:var(--muted);font-size:.95rem}
progress{flex:1;height:.55rem;accent-color:var(--spruce)}
.memo{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--spruce);border-radius:4px;padding:1.2rem 1.4rem;margin-bottom:1.25rem}
.memo h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 .6rem}
.memo dl{display:grid;grid-template-columns:5.2rem 1fr;gap:.15rem .75rem;margin:0 0 .9rem;padding-bottom:.8rem;border-bottom:1px solid var(--rule);font-size:.97rem}
.memo dt{color:var(--muted)} .memo dd{margin:0}
.memo p{margin:.5rem 0;max-width:68ch}
.howto{background:var(--spruce-soft);border-radius:4px;padding:.8rem 1rem;margin:0 0 1.25rem;font-size:.97rem}
.howto strong{font-family:var(--serif)}
.howto ul{margin:.35rem 0 0;padding-left:1.2rem}
details.data{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin:0 0 1.25rem}
details.data>summary{cursor:pointer;padding:.8rem 1rem;font-weight:600;min-height:44px}
details.data .inner{padding:0 1rem 1rem}
.tscroll{overflow-x:auto;margin:.4rem 0 1rem}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
caption{text-align:left;font-weight:600;padding:.2rem 0 .4rem;font-family:var(--serif);font-size:1.02rem}
th,td{padding:.32rem .6rem;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{border-bottom:2px solid var(--ink);font-weight:600}
tr.tot td,tr.tot th{font-weight:700;border-top:1px solid var(--ink)}

.res{color:var(--muted);font-size:.93rem;margin:0 0 .9rem}
.lead{max-width:70ch}

.q{border-top:1px solid var(--rule);margin-top:1.2rem;padding-top:1.1rem}
.q label.ql,.q legend{font-weight:600;display:block;margin-bottom:.45rem;max-width:68ch;padding:0}

.q fieldset{border:0;margin:0;padding:0;min-width:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-variant-numeric:tabular-nums;min-height:46px;width:12rem;padding:.35rem .7rem;border:2px solid var(--muted);border-radius:5px;background:var(--card);color:var(--ink)}

.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--rule);border-radius:5px;margin:.4rem 0;max-width:68ch;cursor:pointer;min-height:44px}
.opt:hover{background:var(--spruce-soft)}
.opt input{margin-top:.3rem;width:1.15rem;height:1.15rem;accent-color:var(--spruce);flex:none}

.opt.picked{border-color:var(--spruce);background:var(--spruce-soft)}
button.btn{font:inherit;font-weight:600;min-height:46px;padding:.45rem 1.15rem;border-radius:5px;border:2px solid var(--spruce);background:var(--spruce);color:var(--spruce-ink);cursor:pointer}
button.btn:hover{filter:brightness(1.08)}
button.btn.alt{background:transparent;color:var(--spruce)}

.fb strong.tag{display:inline-block;margin-right:.35rem}
.fb.ok strong.tag{color:var(--ok)} .fb.no strong.tag{color:var(--miss)}
.notes{margin:.6rem 0 0;padding:0;list-style:none;max-width:68ch}
.notes li{background:var(--note-bg);border-left:6px solid var(--note);padding:.6rem .85rem;margin:.45rem 0;border-radius:4px}
.notes li b{color:var(--note)}
.why{margin:.6rem 0 0;max-width:68ch}
.nextbar{margin-top:1.6rem;padding-top:1.1rem;border-top:2px solid var(--ink);display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.nextbar .hint{color:var(--muted);font-size:.95rem}
textarea{width:100%;max-width:68ch;min-height:9rem;font:inherit;padding:.7rem;border:2px solid var(--muted);border-radius:5px;background:var(--card);color:var(--ink)}

.tick td.bad{font-weight:700;color:var(--miss)}

pre.out{white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);padding:.8rem;border-radius:5px;font-size:.92rem;max-width:80ch}
.cmp{display:grid;grid-template-columns:1fr;gap:.6rem}
.model{background:var(--spruce-soft);border-radius:4px;padding:.8rem 1rem;max-width:72ch}
footer{max-width:1120px;margin:0 auto;padding:0 1.25rem 2rem;color:var(--muted);font-size:.9rem}
@media (max-width:860px){

  nav.steps .lbl{display:none}
  nav.steps button[aria-current="step"] .lbl{display:inline}
  section.step,.memo{padding:1rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  nav.steps,.nextbar button,.btn,details.data,.skip{display:none!important}
  body{background:#fff;color:#000}
  .wrap{display:block}
}

select{font:inherit;min-height:44px;max-width:100%;padding:.3rem .5rem;border:2px solid var(--muted);border-radius:5px;background:var(--card);color:var(--ink)}

/* ---------- Helpers ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtVal(v,spec){
  if(v===null||v===undefined) return '';
  if(typeof v==='string') return v;
  var dec=(spec&&spec.dec)||0;
  if(v===0&&!(spec&&spec.zero)) return '–';
  var s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return v<0?'('+s+')':s;
}
function table(spec){
  var heads=spec.heads, unit=spec.unit||'$ thousands';
  var h='<div class="tscroll" tabindex="0" role="region" aria-label="'+esc(spec.cap)+' (scrolls sideways on small screens)"><table><caption>'+esc(spec.cap)+'</caption><thead><tr><th scope="col">'+esc(unit)+'</th>';
  heads.forEach(function(x){h+='<th scope="col">'+esc(x)+'</th>';});
  h+='</tr></thead><tbody>';
  spec.rows.forEach(function(r){
    if(r[2]==='sub'){h+='<tr class="sub"><th scope="rowgroup" colspan="'+(heads.length+1)+'">'+esc(r[0])+'</th></tr>';return;}
    h+='<tr'+(r[2]==='tot'?' class="tot"':'')+'><th scope="row">'+esc(r[0])+'</th>';
    r[1].forEach(function(v){h+='<td>'+fmtVal(v,spec)+'</td>';});
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function dataPanel(open){
  if(!M.data||!M.data.length) return '';
  return '<details class="data"'+(open?' open':'')+'><summary>'+esc(M.dataTitle||'Cullowhee data')+'</summary><div class="inner">'+
   M.data.map(table).join('')+(M.dataNote?'<p>'+M.dataNote+'</p>':'')+'</div></details>';
}

try{var raw=sessionStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.q) S=p;}}catch(e){}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function qs(id){if(!S.q[id])S.q[id]={wrong:0,done:false,revealed:false,log:[],val:null};return S.q[id];}
function stepDone(i){
  var st=STEPS[i];
  if(st.type==='predict') return S.prediction!==null;
  if(st.type==='memo') return true;

}

/* ---------- Parsing and checking ---------- */
function parseNum(s){
  s=String(s).trim().replace(/[$,\s%]/g,'').replace(/−/g,'-');
  var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  var v=parseFloat(s); return neg?-v:v;
}
function normalize(q,v){ if(q.kind==='pct' && v!==0 && Math.abs(v)<1) return v*100; return v; }
function near(v,t,tol){return Math.abs(v-t)<=tol;}
function sameSet(a,b){a=a.slice().sort().join(',');b=b.slice().sort().join(',');return a===b;}

    h+='</tr></thead><tbody>';
    q.rows.forEach(function(r,ri){
      h+='<tr><th scope="row">'+r.t+'</th>';
      cols.forEach(function(c,ci){
        var cur=vals[ri*cols.length+ci]||'';
        var opts=c.opts||q.opts;
        h+='<td><select data-r="'+ri+'" data-c="'+ci+'" aria-label="'+esc(r.t.replace(/<[^>]+>/g,''))+', '+esc(c.n)+'"'+dis+'><option value="">Choose</option>';

        h+='</select></td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div></fieldset>'+(st.done?'':'<div class="row" style="margin-top:.6rem"><button class="btn" type="submit">Check answers</button></div>')+'</form>';
  }else{
    var multi=q.type==='multi';
    h+='<form data-q="'+q.id+'" novalidate><fieldset'+dis+'><legend>'+idx+'. '+q.label+'</legend>';

      var picked=multi?(st.val||[]).indexOf(o[0])>-1:st.val===o[0];
      h+='<label class="opt'+(picked?' picked':'')+(st.done?' disabled':'')+'"><input type="'+(multi?'checkbox':'radio')+'" name="'+q.id+'" value="'+o[0]+'"'+(picked?' checked':'')+dis+'><span>'+o[1]+'</span></label>';
    });
    h+='</fieldset>'+(st.done?'':'<div class="row" style="margin-top:.6rem"><button class="btn" type="submit">Check answer</button></div>')+'</form>';
  }

  if(st.msg) h+='<div class="fb '+st.msgType+'">'+st.msg+'</div>';
  if(st.done && !st.revealed) h+='<div class="fb ok"><strong class="tag">✓ Correct.</strong>'+(q.explain?q.explain:'')+'</div>';

}
function answerText(q){
  if(q.type==='num') return q.show+'.';

  }
  var map={};q.options.forEach(function(o){map[o[0]]=o[1];});
  var a=q.type==='multi'?q.answers:[q.answer];
  return a.map(function(k){return map[k];}).join(' ');

function tally(){
  var rows=[], tot={n:0,ok:0,bad:0,first:0,shown:0};
  STEPS.forEach(function(st,i){
    if(!st.qs) return;
    var r={step:i,name:st.title,n:st.qs.length,ok:0,bad:0,first:0,shown:0,qrows:[]};
    st.qs.forEach(function(q){
      var s=qs(q.id);
      var ok=s.done&&!s.revealed, first=ok&&s.wrong===0;
      r.ok+=ok?1:0; r.bad+=s.wrong; r.first+=first?1:0; r.shown+=s.revealed?1:0;
      r.qrows.push({label:q.label.replace(/<[^>]+>/g,''),ok:ok,bad:s.wrong,first:first,shown:s.revealed,done:s.done});
    });
    tot.n+=r.n;tot.ok+=r.ok;tot.bad+=r.bad;tot.first+=r.first;tot.shown+=r.shown;
    rows.push(r);
  });
  return {rows:rows,tot:tot};
}

  L.push('Total: '+t.tot.ok+' of '+t.tot.n+' correct; '+t.tot.bad+' incorrect attempts; '+t.tot.first+' correct on first try; '+t.tot.shown+' answers shown');
  if(S.memo){L.push('');L.push('My note: ');L.push(S.memo);}
  return L.join('\n');
}

  h+='</tbody><tfoot><tr><th scope="row">Total</th><td>'+t.tot.ok+' of '+t.tot.n+'</td><td>'+t.tot.bad+'</td><td>'+t.tot.first+' of '+t.tot.n+'</td><td>'+t.tot.shown+'</td></tr></tfoot></table></div>';
  h+='<p class="lead">Steps 1 and '+STEPS.length+' are not scored. An incorrect attempt is any wrong answer you submitted. A question counts as correct once you answer it right, even after retries; answers you chose to show are not counted as correct.</p>';
  h+='<details style="margin:1rem 0"><summary>See the breakdown by question</summary><div class="tscroll" tabindex="0" role="region" aria-label="Results by question"><table class="tick"><caption>Answers by question</caption><thead><tr><th scope="col">Question</th><th scope="col">Result</th><th scope="col">Incorrect attempts</th></tr></thead><tbody>';
  t.rows.forEach(function(r){r.qrows.forEach(function(q,i){
    var res=q.shown?'Answer shown':(q.ok?(q.first?'✓ Correct, first try':'✓ Correct after retries'):'Not answered');
    h+='<tr><th scope="row">Step '+(r.step+1)+', question '+(i+1)+': '+esc(q.label)+'</th><td>'+res+'</td><td>'+q.bad+'</td></tr>';
  });});
  h+='</tbody></table></div></details>';
  h+='<div><label for="nm" style="font-weight:600">Your name (optional, included in the copied summary)</label><br><div class="row" style="margin-top:.35rem"><input type="text" id="nm" autocomplete="name" value="'+esc(S.name)+'" style="width:18rem"></div></div>';
  h+='<h3 style="font-family:var(--serif);margin:1.2rem 0 .4rem">Summary you can copy</h3><pre class="out" id="sum" tabindex="0">'+esc(summaryText(t))+'</pre>';
  h+='<div class="row"><button class="btn" type="button" data-copy="1">Copy summary</button><button class="btn alt" type="button" data-print="1">Print this page</button><button class="btn alt" type="button" data-back="1">Back to step '+STEPS.length+'</button><button class="btn alt" type="button" data-reset="1">'+(S.confirmReset?'Select again to confirm start over':'Start over')+'</button></div><div id="copymsg" class="res" role="status"></div>';
  h+='</section>';
  app.innerHTML=h;
  if(focusHeading){var hd=document.getElementById('step-h');if(hd){hd.focus();window.scrollTo({top:0});}}
}

function render(focusHeading){renderNav();renderStage(focusHeading);}

/* ---------- Events ---------- */
nav.addEventListener('click',function(e){
  var b=e.target.closest('button[data-nav]'); if(!b) return;
  var i=+b.getAttribute('data-nav'); if(i>S.max) {announce('That step is locked until you finish the earlier steps.');return;}
  S.cur=i; save(); render(true);
});
function goNext(){
  var i=S.cur;
  if(i<STEPS.length-1){S.cur=i+1;S.max=Math.max(S.max,S.cur);}
  else {S.cur=STEPS.length;S.max=Math.max(S.max,S.cur);S.done=true;}
  save();render(true);
}
app.addEventListener('click',function(e){
  var t=e.target;
  var rv=t.closest('[data-reveal]');
  if(rv){
    var id=rv.getAttribute('data-reveal'), s=qs(id); s.done=true;s.revealed=true;s.msg=null;
    save(); refreshQ(id); announce('Answer shown.'); return;
  }
  if(t.closest('[data-next]')){goNext();return;}
  if(t.closest('[data-finish]')){S.max=Math.max(S.max,STEPS.length);S.cur=STEPS.length;S.done=true;save();render(true);return;}
  if(t.closest('[data-back]')){S.cur=STEPS.length-1;save();render(true);return;}
  if(t.closest('[data-print]')){window.print();return;}
  if(t.closest('[data-copy]')){
    var txt=document.getElementById('sum').textContent, m=document.getElementById('copymsg');
    function ok(){m.textContent='Summary copied.';announce('Summary copied.');}
    function fail(){var r=document.createRange();r.selectNodeContents(document.getElementById('sum'));var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);m.textContent='Select and copy the highlighted text (Ctrl+C or Command+C).';}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fail);}
      else{fail();}
    }catch(err){fail();}
    return;
  }
  if(t.closest('[data-reset]')){
    if(!S.confirmReset){S.confirmReset=true;save();renderResults(false);return;}
    S={cur:0,max:0,q:{},prediction:null,memo:'',checks:[],name:'',done:false,confirmReset:false};save();render(true);return;
  }
});
function refreshQ(id){
  var q=null,idx=0;
  STEPS[S.cur].qs.forEach(function(x,i){if(x.id===id){q=x;idx=i+1;}});
  var blk=document.getElementById('blk-'+id);
  blk.innerHTML=qInner(q,qs(id),idx);
  var done=stepDone(S.cur), nb=app.querySelector('[data-next]');
  if(nb){nb.disabled=!done;var hint=app.querySelector('.nextbar .hint');if(hint)hint.style.display=done?'none':'';}
}
function firstFocus(id){return document.getElementById('in-'+id)||document.querySelector('#blk-'+id+' select, #blk-'+id+' input');}

app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target;
  if(f.hasAttribute('data-predict')){
    var c=f.querySelector('input[name=pred]:checked');
    if(!c){announce('Choose an option first.');var fb=document.createElement('div');fb.className='fb no';fb.textContent='Choose one option, then lock in your prediction.';if(!f.querySelector('.fb'))f.appendChild(fb);return;}
    S.prediction=c.value;save();render(false);
    announce('Prediction locked in.');
    var nb=app.querySelector('[data-next]'); if(nb) nb.focus();
    return;
  }
  if(f.hasAttribute('data-memo')){return;}
  var id=f.getAttribute('data-q'); if(!id) return;
  var q=null; STEPS[S.cur].qs.forEach(function(x){if(x.id===id) q=x;});
  var s=qs(id); if(s.done) return;
  var correct=false, trap=null, empty=false;
  if(q.type==='num'){
    var inp=f.querySelector('input[type=text]'), raw=inp.value; s.val=raw;
    if(!raw.trim()){empty=true;s.msg='Enter a number first.';s.msgType='info';}
    else{
      var v=parseNum(raw);
      if(isNaN(v)){empty=true;s.msg='Enter a number, such as 12.5. Commas, $ and % signs are fine.';s.msgType='info';}
      else{
        v=normalize(q,v);
        if(near(v,q.answer,q.tol)) correct=true;
        else (q.traps||[]).forEach(function(tp){if(!trap&&near(v,tp.v,tp.tol)) trap=tp.msg;});
      }
    }
  }else if(q.type==='grid'){
    var sels=[].slice.call(f.querySelectorAll('select')), vals=sels.map(function(x){return x.value;});
    s.val=vals;
    if(vals.some(function(x){return !x;})){empty=true;s.msg='Choose an answer in every cell first.';s.msgType='info';}
    else{
      var badRows=[], nc=q.cols.length;
      q.rows.forEach(function(r,ri){
        var ok=true;for(var ci=0;ci<nc;ci++){if(vals[ri*nc+ci]!==r.a[ci]) ok=false;}
        if(!ok) badRows.push(ri);
      });
      if(!badRows.length) correct=true;
      else{
        var parts=['Check '+(badRows.length===1?'row ':'rows ')+badRows.map(function(x){return x+1;}).join(', ')+'.'];
        badRows.slice(0,2).forEach(function(ri){if(q.rows[ri].why) parts.push('Row '+(ri+1)+': '+q.rows[ri].why);});
        trap=parts.join(' ');
      }
    }
  }else if(q.type==='mc'){
    var c2=f.querySelector('input:checked');
    if(!c2){empty=true;s.msg='Choose an answer first.';s.msgType='info';}
    else{s.val=c2.value; if(c2.value===q.answer) correct=true; else trap=(q.optHints||{})[c2.value]||null;}
  }else{
    var picks=[].slice.call(f.querySelectorAll('input:checked')).map(function(x){return x.value;});
    s.val=picks;
    if(!picks.length){empty=true;s.msg='Select at least one answer first.';s.msgType='info';}
    else if(sameSet(picks,q.answers)) correct=true;
    else{
      var msgs=[];picks.forEach(function(k){if(q.answers.indexOf(k)<0 && q.optHints && q.optHints[k]) msgs.push(q.optHints[k]);});
      var missing=q.answers.filter(function(k){return picks.indexOf(k)<0;});
      if(missing.length && !msgs.length) msgs.push('You have not selected everything that applies.');
      trap=msgs.join(' ');
    }
  }
  if(empty){save();refreshQ(id);announce(s.msg);var ni=firstFocus(id);if(ni)ni.focus();return;}
  if(correct){
    s.done=true;s.msg=null;save();refreshQ(id);
    announce('Correct. '+(q.explain||'').replace(/<[^>]+>/g,''));
    var nextQ=null;STEPS[S.cur].qs.forEach(function(x){if(!nextQ&&!qs(x.id).done)nextQ=x;});
    if(nextQ){var ni2=firstFocus(nextQ.id);if(ni2)ni2.focus();}
    else{var nb2=app.querySelector('[data-next]');if(nb2)nb2.focus();}
    return;
  }
  s.wrong++; s.log.push({msg:trap}); s.msg='<strong class="tag">✗ Not quite.</strong>Try again. Reviewer\'s note '+s.log.length+' is below.'; s.msgType='no';
  save();refreshQ(id);
  var tier=Math.min(s.log.length,3);
  announce('Not quite. '+((trap||'')+' '+(q.hints[tier-1]||'')).replace(/<[^>]+>/g,''));
  var again=firstFocus(id);
  if(again){again.focus(); if(again.select&&again.type==='text')again.select();}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('[data-check]')){
    var i=+t.getAttribute('data-check'), k=S.checks.indexOf(i);
    if(t.checked&&k<0)S.checks.push(i); if(!t.checked&&k>-1)S.checks.splice(k,1); save();
  }
  if(t.closest('.opt')){
    var grp=t.closest('form').querySelectorAll('.opt');
    [].forEach.call(grp,function(l){l.classList.toggle('picked',l.querySelector('input').checked);});
  }
});
app.addEventListener('input',function(e){
  if(e.target.id==='memo'){S.memo=e.target.value;save();}
  if(e.target.id==='nm'){S.name=e.target.value;save();var sm=document.getElementById('sum');if(sm)sm.textContent=summaryText(tally());}
});

render(false);
})();

</script>
</body>
</html>
